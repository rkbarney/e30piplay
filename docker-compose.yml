# Dev preview: nginx + built app + ROM API on http://127.0.0.1:8080
#   docker compose up --build
#
# Drop ROMs (.nes, .gb, .gbc, .sfc, .smc) into ./roms/ before starting.
#
# Note: Spotify OAuth is Pi-only (phone QR → richardbarney.com bouncer →
# s52.local/spotify-callback). There is no Docker dev path for it — the
# loopback flow never worked, so the dev preview ships without a spotify
# service. Test Spotify login on the Pi.

services:
  api:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./carplay-server.cjs:/app/carplay-server.cjs:ro
      - ./roms:/app/roms
    environment:
      APP_DIR: /app
      PORT: "3001"
      HOST: 0.0.0.0
    command: node carplay-server.cjs

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    # Bind to loopback only: the proxied /api (branch switch / deploy / process
    # control) is a privileged surface the Pi keeps loopback-only in nginx —
    # don't expose it to the dev machine's LAN.
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./roms:/roms:ro
    depends_on:
      - api
