# Dev preview: nginx + built app + ROM API on http://localhost:8080
#   docker compose up --build
#
# Drop ROMs (.nes, .gb, .gbc, .sfc, .smc) into ./roms/ before starting.

services:
  api:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./carplay-server.cjs:/app/carplay-server.cjs:ro
      - ./roms:/app/roms
    environment:
      APP_DIR: /app
      PORT: "3001"
      HOST: 0.0.0.0
    command: node carplay-server.cjs

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./roms:/roms:ro
    depends_on:
      - api
