# Dev Docker: HTTP on 80 (host maps 8080→80) — open http://127.0.0.1:8080.
# Spotify has no Docker dev path (Pi-only OAuth); no spotify proxy here.

server {
    listen 80;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api {
        proxy_pass         http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ^~ /roms/ {
        alias /roms/;
        add_header Cache-Control "no-cache";
    }

    # EmulatorJS assets — never SPA-fallback; missing files must 404 so loader.js
    # can detect failures and fall back to src/ bundles.
    location ^~ /emulatorjs/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
